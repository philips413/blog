{{ define "main" -}}
<section class="window" aria-labelledby="list-title">
  <div class="titlebar"><span class="box"></span><h1 class="t" id="list-title">~/blog/{{ .Data.Plural }}</h1><span class="box"></span></div>
  <div class="toolbar"><span>{{ len .Data.Terms }}개 폴더 · 글 많은 순</span></div>
  <div class="folders">
    {{- range .Data.Terms.ByCount }}
    <a class="ico" href="{{ .Page.RelPermalink }}">
      <span class="folder" aria-hidden="true"><span class="n">{{ .Count }}</span></span>
      <span class="lbl">{{ .Page.Title }}<span class="sr"> ({{ .Count }}개)</span></span>
    </a>
    {{- end }}
  </div>
</section>
{{- end }}
