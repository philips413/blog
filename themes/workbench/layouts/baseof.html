<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "ko" }}">
<head>
{{- partial "head.html" . }}
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
{{ partial "header.html" . }}
<main id="main" class="{{ block "mainclass" . }}wrap{{ end }}">
  {{- block "main" . }}{{ end }}
</main>
<footer class="foot">
  <div class="wrap">
    <span>© {{ with site.Params.footer.since }}{{ . }}–{{ end }}{{ now.Year }} {{ site.Copyright }}</span>
    <span>Hugo로 만들고 GitHub Pages로 배포 · <a href="{{ "index.xml" | relURL }}">RSS</a></span>
  </div>
</footer>
{{ $js := resources.Get "js/workbench.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" data-index="{{ "index.json" | relURL }}" defer></script>
</body>
</html>
