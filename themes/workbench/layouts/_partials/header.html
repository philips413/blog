{{ $cur := . -}}
<header class="top">
  <div class="wrap">
    <a class="brand" href="{{ "/" | relURL }}">{{ replace (site.Title | htmlEscape) ".dev" "<code>.dev</code>" | safeHTML }}</a>
    <nav class="menu" aria-label="주 메뉴">
      {{- range site.Menus.main }}
      <a href="{{ .URL }}"{{ if or ($cur.IsMenuCurrent "main" .) ($cur.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sr" for="q">글 검색</label>
      <input id="q" type="search" placeholder="글 검색" autocomplete="off" aria-controls="results">
      <span class="kbd" aria-hidden="true">/</span>
      <div class="results" id="results" role="region" aria-live="polite" hidden></div>
    </div>
    <button class="icon-btn" id="theme" type="button" aria-label="다크 모드 전환">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
