{{ $cur := .RelPermalink -}}
{{ with site.Taxonomies.tags -}}
<section class="window" aria-label="태그">
  <div class="titlebar"><span class="box"></span><span class="t">tags/</span><span class="box"></span></div>
  <div class="tagcloud">
    {{- range .ByCount }}
    <a href="{{ .Page.RelPermalink }}"{{ if eq $cur .Page.RelPermalink }} class="cur"{{ end }}>{{ .Page.Title }}<small>{{ .Count }}</small></a>
    {{- end }}
  </div>
</section>
{{- end }}
