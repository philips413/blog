{{ $cur := . -}}
<header class="menubar wrap">
  <a class="brand" href="{{ "/" | relURL }}"><img src="{{ "favicon.svg" | relURL }}" width="16" height="16" alt="">{{ site.Params.brand | default site.Title }}</a>
  <nav aria-label="주 메뉴">
    {{- range site.Menus.main }}
    <a href="{{ .URL }}"{{ if or ($cur.IsMenuCurrent "main" .) ($cur.HasMenuCurrent "main" .) }} class="cur" aria-current="page"{{ end }}>{{ .Name }}</a>
    {{- end }}
  </nav>
  <div class="search" role="search">
    <label class="sr" for="q">글 검색</label>
    <input id="q" type="search" placeholder="검색…" autocomplete="off" aria-controls="results">
    <div class="results" id="results" role="region" aria-live="polite" hidden></div>
  </div>
  <time class="clock" id="clock" datetime="{{ now.Format "2006-01-02" }}">{{ now.Format "2006.01.02" }}</time>
</header>
